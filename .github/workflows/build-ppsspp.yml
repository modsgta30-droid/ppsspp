name: Build PPSSPP 1.19.3 (armeabi-v7a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Baixar PPSSPP v1.19.3 (código original, sem alterações)
        uses: actions/checkout@v4
        with:
          repository: hrydgard/ppsspp
          ref: v1.19.3
          submodules: recursive
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Mostrar configuração real do build da tag
        run: |
          git describe --tags || true
          grep -n -E "ndkVersion|ANDROID_PLATFORM|compileSdk|minSdk|targetSdk|abiFilters|splits|include " android/build.gradle || true
          cat gradle/wrapper/gradle-wrapper.properties || true

      - name: Instalar o NDK pedido pelo projeto
        run: |
          NDK=$(sed -n "s/.*ndkVersion[ =]*[\"']\([^\"']*\)[\"'].*/\1/p" android/build.gradle | head -1)
          echo "NDK pedido: '$NDK'"
          if [ -n "$NDK" ]; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "ndk;$NDK"
          fi
          sdkmanager "cmake;3.22.1" || true

      - name: Compilar APK (somente armeabi-v7a)
        run: |
          chmod +x gradlew
          ./gradlew assembleNormalOptimized \
            -Pandroid.injected.build.abi=armeabi-v7a \
            --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Listar APKs gerados
        if: always()
        run: find . -name "*.apk" -print -exec ls -l {} \;

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-1.19.3-armv7-apk
          path: |
            android/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Enviar log de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          
